  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: How does pricing work?
      answerHtml: "&bull; The Free plan is available forever. The Personal Pro plan unlocks Pro features across dbdiagram and dbdocs in your Personal Workspace.<br><br>&bull; The Team plan brings your team together to collaborate on a centralized Team Workspace, across both dbdiagram and dbdocs."
    - question: How can I manage my subscription?
      answerHtml: "You can manage your workspace's subscription in Home > Billing. You can find your workspace's \"Home\" shortcut in the top-right account dropdown menu."
    - question: Do you store my credit card information?
      answerHtml: "No, we do not handle your credit card information directly. We're using Stripe to process your payment."
    - question: What happens if I cancel my subscription?
      answerHtml: When cancel your subscription, your workspace will be reverted to the Free plan. Private projects will be converted to public projects and workspace members will be unable to access the workspace.
    - question: Will my plan be automatically renewed?
      answerHtml: Paid subscription is automatically renewed unless you cancel your plan before the end of the subscription period.
    - question: Do I get both dbdiagram and dbdocs features on one plan?
      answerHtml: "Yes, you will get both dbdiagram and dbdocs features on the same plan."
    - question: How does the Custom Plan work?
      answerHtml: "Custom Plans are customized for organizations with specific needs. Contact our sales team to discuss pricing, custom payment terms, and enterprise features like SSO and priority support."
    - question: "I'm concerned about security. Do you offer a self-hosted version of dbdocs?"
      answerHtml: "We understand the importance of safeguarding your data. If you're looking for a self-hosted version of dbdocs, simply fill out this <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">form</a>, and our team will be in touch to discuss your specific requirements."
    - question: I have questions. How can I get in touch?
      answerHtml: "Drop us an email at <a href=\"mailto:dbdiagram{'@'}holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram{'@'}holistics.io</a>."
