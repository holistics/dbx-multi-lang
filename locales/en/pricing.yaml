  # ========================================
  # Feature Blocks - Pro features
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: Start small with Diagram Views
        description: "Think big, start small. Create multiple, focused views of the same diagram. Show the tables you need for a domain, workflow, or team conversation."
      passwordProtection:
        title: Secure diagram with Password Protection
        description: Protect your diagrams with Password Protection and improve privacy. Perfect for internal sharing across the team.
      tableGroups:
        title: Better organizing with Table Group
        description: Group multiple tables together for easier visualizing. Reduce your workload when working with database that has lots of tables.
      headerColors:
        title: Manages diagrams with Header Color
        description: Easily manage your diagrams and database documents by changing table header colors and make it more colorful!
      detailLevels:
        title: Simplify diagrams with Detail Levels
        description: Toggle between different detail levels to simplify your diagrams. This feature is especially useful when working with large database designs.
      stickyNotes:
        title: Collaborate better with Sticky Notes
        description: "Need to jot down a quick reminder or elaborate on a complex idea? You can add notes directly to your diagrams, right where you need them."
      aiAssistant:
        title: Accelerate workflow with AI Assistant
        description: Get intelligent suggestions and speed up your database design workflow with our AI-powered assistant.
      collaboration:
        title: Real-time Collaborative Editing
        description: Invite your colleagues to work on the same diagram with you in real-time.
      versionHistory:
        title: Turn back time with Version History
        description: Freely experiment your ideas with different schema versions. Roll back to a past version whenever you want.
      schemaChangelog:
        title: Unlimited Schema Changelog history
        description: "Never lose track of your database schema changes again. Access all schema changes, browse versions older than 14 days, and compare any two versions with ease."
      embeddedViews:
        title: Embedded Views
        description: "You can embed your database documentation into platforms like Notion, Confluence, Miro, or even you own website. See your database documentation in the tool that you already loved."
      shareWithInvitedUsers:
        title: Share with invited users
        description: "Directly invite and manage colleagues in your project—perfect for internal team sharing."
    team:
      collaborativeWorkspace:
        title: Collaborative Workspace
        description: "Have a central place for your whole team to store, access, and share your database diagrams and documents."
      teamManagement:
        title: Team Management & Collaboration
        description: "Invite and manage your teammates in one workspace, and allow them to take advantage of the Team plan's benefits."
      unifiedBilling:
        title: Unified Admin and Billing
        description: Purchase and manage multiple user licenses for team members. Manage users and billing in one place.

