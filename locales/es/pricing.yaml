      teamManagement:
        name: Gestión de equipo y colaboración
        description: "Por puesto: editores y lectores ilimitados"
      unifiedAdmin:
        name: Administración y facturación unificadas
        description: Un solo panel para gestionar los miembros del equipo y la facturación
      cli:
