      detailLevels:
        name: Niveles de detalle
        description: Controla la visibilidad de los detalles de las tablas en diferentes vistas
      stickyNotes:
        name: Notas adhesivas
        description: Agrega anotaciones y comentarios a tus diagramas
      embeddedDiagrams:
        name: Vistas incrustadas
        description: Incrusta un diagrama o una página de documentación como iframe en herramientas como Notion, Confluence o tu propio sitio
      publicDiagram:
        name: Compartir por enlace público
