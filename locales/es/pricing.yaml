  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: ¿Cómo funciona el precio?
      answerHtml: "&bull; El plan Free está disponible para siempre. El plan Personal Pro desbloquea las funciones Pro en dbdiagram y dbdocs en tu espacio de trabajo personal.<br><br>&bull; El plan Team reúne a tu equipo para colaborar en un espacio de trabajo Team centralizado, tanto en dbdiagram como en dbdocs."
    - question: ¿Cómo puedo gestionar mi suscripción?
      answerHtml: "Puedes gestionar la suscripción de tu espacio de trabajo en Inicio > Facturación. Puedes encontrar el acceso directo a \"Inicio\" de tu espacio de trabajo en el menú desplegable de cuenta en la esquina superior derecha."
    - question: ¿Almacenan mi información de tarjeta de crédito?
      answerHtml: "No, no manejamos tu información de tarjeta de crédito directamente. Usamos Stripe para procesar tu pago."
    - question: ¿Qué sucede si cancelo mi plan Personal Pro o Team?
      answerHtml: Después de cancelar el plan Personal Pro, tu cuenta volverá al plan Free al final del período.
    - question: ¿Mi plan se renovará automáticamente?
      answerHtml: La suscripción de pago se renueva automáticamente a menos que canceles tu plan antes del final del período de suscripción.
    - question: ¿Obtengo las funciones de dbdiagram y dbdocs en un solo plan?
      answerHtml: "Sí, obtendrás las funciones de dbdiagram y dbdocs en el mismo plan."
    - question: ¿Cómo funciona el Custom Plan?
      answerHtml: "Los Custom Plans están personalizados para organizaciones con necesidades específicas. Contacta a nuestro equipo de ventas para hablar sobre precios, términos de pago personalizados y funciones empresariales como SSO y soporte prioritario."
    - question: "Me preocupa la seguridad. ¿Ofrecen una versión autoalojada de dbdocs?"
      answerHtml: "Entendemos la importancia de proteger tus datos. Si buscas una versión autoalojada de dbdocs, simplemente completa este <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">formulario</a>, y nuestro equipo se pondrá en contacto para hablar sobre tus requisitos específicos."
    - question: Tengo preguntas. ¿Cómo puedo comunicarme?
      answerHtml: "Envíanos un correo electrónico a <a href=\"mailto:dbdiagram@holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram@holistics.io</a>."
