  # ========================================
  # Feature Blocks - Pro features
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: Comienza con las vistas de diagrama
        description: "Piensa en grande, comienza en pequeño. Crea múltiples vistas enfocadas del mismo diagrama. Muestra las tablas que necesitas para un dominio, flujo de trabajo o conversación de equipo."
      passwordProtection:
        title: Protección con contraseña y modo privado
        description: Restringe el acceso a tus diagramas y documentos de base de datos con protección por contraseña o modo privado. Perfecto para compartir internamente en el equipo.
      tableGroups:
        title: Organiza mejor con grupos de tablas
        description: Agrupa varias tablas para facilitar la visualización. Reduce tu carga de trabajo al trabajar con bases de datos que tienen muchas tablas.
      headerColors:
        title: Colores de encabezado de tablas
        description: Gestiona fácilmente tus diagramas y documentos de base de datos cambiando los colores de los encabezados de las tablas. ¡Hazlo más colorido!
      detailLevels:
        title: Niveles de detalle del diagrama
        description: "Alterna entre mostrar todas las columnas, mostrar solo las columnas clave (PK, FK) o incluso ocultar todas las columnas según tus necesidades."
      stickyNotes:
        title: Colabora mejor con notas adhesivas
        description: "¿Necesitas anotar un recordatorio rápido o desarrollar una idea compleja? Puedes agregar notas directamente a tus diagramas y documentos, justo donde las necesitas."
      aiAssistant:
        title: Acelera tu flujo de trabajo con el asistente de IA
        description: Obtén sugerencias inteligentes y acelera tu flujo de trabajo de diseño de bases de datos con nuestro asistente impulsado por IA.
      collaboration:
        title: Edición colaborativa en tiempo real
        description: Invita a tus colegas a trabajar en el mismo diagrama contigo en tiempo real.
      versionHistory:
        title: Retrocede en el tiempo con el historial de versiones
        description: Experimenta libremente tus ideas con diferentes versiones del esquema. Vuelve a una versión anterior cuando quieras.
      schemaChangelog:
        title: Historial ilimitado de cambios del esquema
        description: "Nunca pierdas el rastro de los cambios en tu esquema de base de datos. Accede a todos los cambios del esquema, navega por versiones con más de 14 días y compara cualquier par de versiones con facilidad."
      embeddedViews:
        title: Vistas incrustadas
        description: "Puedes incrustar tu documentación de base de datos en plataformas como Notion, Confluence, Miro o incluso en tu propio sitio web. Consulta tu documentación de base de datos en la herramienta que ya usas."
      shareWithInvitedUsers:
        title: Compartir con usuarios invitados
        description: "Invita y gestiona colegas directamente en tu proyecto, perfecto para compartir internamente en el equipo."
    team:
      collaborativeWorkspace:
        title: Espacio de trabajo colaborativo
        description: "Ten un lugar central para que todo tu equipo almacene, acceda y comparta tus diagramas y documentos de base de datos."
      teamManagement:
        title: Gestión de equipo y colaboración
        description: "Invita y gestiona a tus compañeros de equipo en un solo espacio de trabajo, y permite que aprovechen los beneficios del plan Team."
      unifiedBilling:
        title: Administración y facturación unificadas
        description: Compra y gestiona múltiples licencias de usuario para los miembros del equipo. Gestiona usuarios y facturación en un solo lugar.

