# Pricing translations - Public pricing page, plan cards, feature comparison, FAQ
# UI Areas: Pricing landing page, Plan cards, Feature blocks, Comparison table, dbdocs promos

pricing:
  # ========================================
  # Pricing Landing Page - Top-level headings
  # ========================================
  landing:
    badge: dbdiagram과 dbdocs를 위한 하나의 플랜 # Badge above title
    title: 워크스페이스를 업그레이드하세요 # Page title
    subtitle: 모든 유료 플랜에는 dbdiagram과 dbdocs가 함께 포함되어 있습니다. # Subtitle

  # ========================================
  # Misc UI labels
  # ========================================
  ui:
    learnMore: 자세히 보기 →
    faqTitle: 자주 묻는 질문
    taxNote: "* 결제 시 해당 국가의 세금이 적용됩니다"
    plansAndFeatures: 플랜 및 기능
    features: 기능
    whatsInProPlan: Personal Pro 플랜에 포함된 기능
    whatsInTeamPlan: Team 플랜에 포함된 기능
    dbdocsFreePaidTitle: dbdocs
    dbdocsFreePaidHeading: 무료 vs 유료

  # ========================================
  # Billing Toggle - Monthly/Annual switch
  # ========================================
  billingToggle:
    monthly: 월별 # Left toggle label
    annual: 연간 # Right toggle label
    saveUpTo: "최대 {percent}% 절약" # Save badge text

  # ========================================
  # Plan Names
  # ========================================
  planNames:
    free: Free # Free plan name
    personalPro: Personal Pro # Personal Pro plan name
    team: Team # Team plan name
    customPlan: Custom Plan # Enterprise/Custom plan name

  # ========================================
  # Plan Taglines
  # ========================================
  taglines:
    free: 스키마를 설계하고 공개 문서를 공유하는 개인 사용자를 위한 플랜입니다. # Free plan tagline
    pro: 설계와 문서화를 담당하는 프리랜서 및 컨설턴트를 위한 플랜입니다. # Pro plan tagline
    team: 데이터베이스를 함께 설계하고 문서화하는 팀을 위한 플랜입니다. # Team plan tagline
    enterprise: 보안 및 조달 요구 사항이 있는 조직을 위한 플랜입니다. # Enterprise plan tagline

  # ========================================
  # Plan Card - Price display
  # ========================================
  price:
    free: Free # Free plan price text
    freeNote: "영원히 무료입니다" # Free plan price note
    customPricing: 맞춤 가격 # Enterprise price text
    contactForPricing: 가격 문의 # Enterprise price note
    perMonth: /월 # Per month unit suffix
    billedAnnually: "연간 청구 - 연 {currency}{amount}" # Annual billing hint
    billedMonthly: 월별 청구 # Monthly billing hint

  # ========================================
  # Plan Card - CTA Buttons
  # ========================================
  cta:
    getStartedFree: 무료로 시작하기 # Free plan CTA
    upgradeNow: 지금 업그레이드 # Pro/Team upgrade CTA
    startFreeTrial: 7일 무료 체험 시작 # Team trial CTA
    contactSales: 영업팀 문의 # Enterprise CTA
    downgrade: 다운그레이드 # Downgrade button
    currentPlan: 현재 플랜 # Current plan label

  # ========================================
  # Plan Card - Recommended badge
  # ========================================
  recommended: 추천 # Recommended badge on plan card

  # ========================================
  # Plan Card - Inherits from
  # ========================================
  inheritsFrom:
    prefix: "" # "Everything in {plan}, plus"
    suffix: "의 모든 기능, 추가로" # suffix after plan name
    free: Free # Inherits from Free
    personalPro: Personal Pro # Inherits from Personal Pro
    team: Team # Inherits from Team

  # ========================================
  # Plan Card - Tier limits
  # ========================================
  tiers:
    upTo10Diagrams: 최대 10개의 다이어그램 및 문서 프로젝트 # Free tier capacity
    unlimitedDiagrams: 무제한 다이어그램 및 문서 프로젝트 # Paid tier capacity
    users: "단일 사용자 | {count}명의 사용자"
    docProjects: "{count}개의 dbdocs 유료 문서 프로젝트 | {count}개의 dbdocs 유료 문서 프로젝트"

  # ========================================
  # Plan Card - Add-ons
  # ========================================
  addons:
    label: "추가 옵션:" # Add-ons section label
    extraDocProject: 추가 유료 문서 프로젝트 # Doc project addon name
    extraUser: 추가 사용자 # User addon name
    extraUserTooltip: "사용자 라이선스는 편집자를 위한 것입니다 - 다이어그램과 문서를 만들고 변경하는 사람들입니다. 뷰어는 항상 무료이며 라이선스가 필요하지 않습니다." # User addon tooltip

  # ========================================
  # Plan Card - Features lists
  # ========================================
  cardFeatures:
    free:
      sqlImportExport: SQL 가져오기 및 내보내기
      exportFormats: PDF/PNG/SVG로 내보내기
      publicSharing: 공개 공유
      embedDiagrams: 사이트에 다이어그램 및 문서 임베드
      dataSample: 데이터 샘플
      cliIntegration: dbdiagram CLI를 통한 CI/CD 파이프라인 통합
    pro:
      unlimitedViews: 무제한 다이어그램 보기
      passwordProtected: 비밀번호 보호 및 비공개 공유
      limitedCollaboration: 제한된 협업
      advancedVisualization: 대규모 데이터베이스 작업을 위한 고급 시각화
    team:
      collaborativeWorkspace: 협업 워크스페이스
      teamManagement: 팀 관리 및 협업
      unifiedBilling: 통합 관리 및 결제
    enterprise:
      prioritizedFeature: 우선 기능 요청
      procurementReview: 조달 또는 법률 검토
      customPayment: 맞춤 결제 조건
      samlSso: SAML SSO
      activityLog: 사용자 활동 로그 (출시 예정)
      ipAllowList: IP 허용 목록 (출시 예정)

  # ========================================
  # Feature Blocks - Pro features
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: 다이어그램 보기로 작게 시작하세요
        description: "크게 생각하고, 작게 시작하세요. 동일한 다이어그램의 여러 집중 보기를 만드세요. 도메인, 워크플로우 또는 팀 대화에 필요한 테이블을 표시하세요."
      passwordProtection:
        title: 비밀번호 보호 및 비공개 모드
        description: 비밀번호 보호 또는 비공개 모드로 다이어그램과 데이터베이스 문서에 대한 접근을 제한하세요. 팀 내부 공유에 적합합니다.
      tableGroups:
        title: 테이블 그룹으로 더 잘 정리하세요
        description: 여러 테이블을 그룹으로 묶어 더 쉽게 시각화하세요. 테이블이 많은 데이터베이스 작업 시 업무량을 줄여줍니다.
      headerColors:
        title: 테이블 헤더 색상
        description: 테이블 헤더 색상을 변경하여 다이어그램과 데이터베이스 문서를 쉽게 관리하고 더 다채롭게 만드세요!
      detailLevels:
        title: 다이어그램 세부 수준
        description: "필요에 따라 모든 컬럼 표시, 키(PK, FK) 컬럼만 표시, 또는 모든 컬럼 숨기기 간에 전환하세요."
      stickyNotes:
        title: 스티커 메모로 더 나은 협업을 하세요
        description: "빠른 메모를 남기거나 복잡한 아이디어를 설명해야 하나요? 필요한 곳에 다이어그램과 문서에 직접 메모를 추가할 수 있습니다."
      aiAssistant:
        title: AI 어시스턴트로 워크플로우를 가속화하세요
        description: 지능적인 제안을 받고 AI 기반 어시스턴트로 데이터베이스 설계 워크플로우를 빠르게 진행하세요.
      collaboration:
        title: 실시간 협업 편집
        description: 동료를 초대하여 동일한 다이어그램에서 실시간으로 함께 작업하세요.
      versionHistory:
        title: 버전 기록으로 시간을 되돌리세요
        description: 다양한 스키마 버전으로 아이디어를 자유롭게 실험하세요. 원할 때마다 이전 버전으로 롤백할 수 있습니다.
      schemaChangelog:
        title: 무제한 스키마 변경 로그 기록
        description: "데이터베이스 스키마 변경 사항을 다시는 놓치지 마세요. 모든 스키마 변경 사항에 접근하고, 14일 이전 버전을 찾아보고, 두 버전을 쉽게 비교하세요."
      embeddedViews:
        title: 임베디드 뷰
        description: "Notion, Confluence, Miro 또는 자체 웹사이트와 같은 플랫폼에 데이터베이스 문서를 임베드할 수 있습니다. 이미 사용하고 계신 도구에서 데이터베이스 문서를 확인하세요."
      shareWithInvitedUsers:
        title: 초대된 사용자와 공유
        description: "프로젝트에서 동료를 직접 초대하고 관리하세요\u2014내부 팀 공유에 적합합니다."
    team:
      collaborativeWorkspace:
        title: 협업 워크스페이스
        description: "팀 전체가 데이터베이스 다이어그램과 문서를 저장, 접근, 공유할 수 있는 중앙 공간을 마련하세요."
      teamManagement:
        title: 팀 관리 및 협업
        description: "하나의 워크스페이스에서 팀원을 초대하고 관리하며, Team 플랜의 혜택을 활용할 수 있도록 하세요."
      unifiedBilling:
        title: 통합 관리 및 결제
        description: 팀원을 위한 여러 사용자 라이선스를 구매하고 관리하세요. 사용자와 결제를 한 곳에서 관리하세요.

