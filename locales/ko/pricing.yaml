  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: 가격은 어떻게 책정되나요?
      answerHtml: "&bull; Free 플랜은 영원히 사용할 수 있습니다. Personal Pro 플랜은 개인 워크스페이스에서 dbdiagram과 dbdocs의 프로 기능을 활성화합니다.<br><br>&bull; Team 플랜은 팀이 dbdiagram과 dbdocs 모두에서 중앙 집중식 팀 워크스페이스에서 협업할 수 있도록 합니다."
    - question: 구독을 어떻게 관리할 수 있나요?
      answerHtml: "홈 > 결제에서 워크스페이스의 구독을 관리할 수 있습니다. 오른쪽 상단 계정 드롭다운 메뉴에서 워크스페이스의 \"홈\" 바로가기를 찾을 수 있습니다."
    - question: 신용카드 정보를 저장하나요?
      answerHtml: "아니요, 신용카드 정보를 직접 처리하지 않습니다. 결제 처리에 Stripe를 사용하고 있습니다."
    - question: Personal Pro 또는 Team 플랜을 취소하면 어떻게 되나요?
      answerHtml: Personal Pro 플랜을 취소하면, 기간 종료 시 계정이 Free 플랜으로 전환됩니다.
    - question: 플랜이 자동으로 갱신되나요?
      answerHtml: 유료 구독은 구독 기간이 끝나기 전에 플랜을 취소하지 않는 한 자동으로 갱신됩니다.
    - question: 하나의 플랜으로 dbdiagram과 dbdocs 기능을 모두 이용할 수 있나요?
      answerHtml: "네, 동일한 플랜에서 dbdiagram과 dbdocs 기능을 모두 이용할 수 있습니다."
    - question: Custom Plan은 어떻게 작동하나요?
      answerHtml: "Custom Plan은 특정 요구 사항이 있는 조직을 위해 맞춤 설정됩니다. 영업팀에 연락하여 가격, 맞춤 결제 조건, SSO 및 우선 지원과 같은 기업 기능에 대해 상의하세요."
    - question: "보안이 걱정됩니다. dbdocs의 자체 호스팅 버전을 제공하나요?"
      answerHtml: "데이터 보호의 중요성을 잘 알고 있습니다. dbdocs의 자체 호스팅 버전을 찾고 계시다면, 이 <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">양식</a>을 작성해 주시면, 저희 팀이 구체적인 요구 사항에 대해 연락드리겠습니다."
    - question: 질문이 있습니다. 어떻게 연락할 수 있나요?
      answerHtml: "<a href=\"mailto:dbdiagram{'@'}holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram{'@'}holistics.io</a>로 이메일을 보내주세요."
