      features: "무제한 다이어그램과 문서, 고급 시각화, 협업 기능."
      featuresLink: "Pro에 포함된 모든 기능 보기"
      reminder: "1년이 끝나기 2주 전에 알려 드립니다. 종료되면 다시 신청할 수 있습니다."
    signIn:
      note: "신청하려면 학교 또는 대학 이메일로 로그인하세요."
      cta: "지금 신청"
    share:
