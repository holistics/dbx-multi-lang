  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: 料金体系はどのようになっていますか？
      answerHtml: "&bull; Free プランはずっと無料でご利用いただけます。Personal Pro プランは、パーソナルワークスペースで dbdiagram と dbdocs の Pro 機能をすべてご利用いただけます。<br><br>&bull; Team プランは、dbdiagram と dbdocs の両方で、集中管理された Team ワークスペースでチームの共同作業を実現します。"
    - question: サブスクリプションはどのように管理できますか？
      answerHtml: "ワークスペースのサブスクリプションは「ホーム」>「請求」から管理できます。ワークスペースの「ホーム」ショートカットは、右上のアカウントドロップダウンメニューにあります。"
    - question: クレジットカード情報は保存されますか？
      answerHtml: "いいえ、お客様のクレジットカード情報を直接取り扱うことはありません。お支払いの処理には Stripe を使用しています。"
    - question: サブスクリプションをキャンセルするとどうなりますか？
      answerHtml: サブスクリプションをキャンセルすると、ワークスペースは Free プランに戻ります。非公開プロジェクトは公開プロジェクトに変換され、ワークスペースメンバーはワークスペースにアクセスできなくなります。
    - question: プランは自動更新されますか？
      answerHtml: 有料サブスクリプションは、契約期間の終了前にプランをキャンセルしない限り、自動的に更新されます。
    - question: ひとつのプランで dbdiagram と dbdocs の両方の機能を利用できますか？
      answerHtml: "はい、同じプランで dbdiagram と dbdocs の両方の機能をご利用いただけます。"
    - question: Custom Plan はどのように機能しますか？
      answerHtml: "Custom Plan は、特定のニーズを持つ組織向けにカスタマイズされています。料金、カスタム支払い条件、SSO や優先サポートなどのエンタープライズ機能については、営業チームにお問い合わせください。"
    - question: "セキュリティが心配です。dbdocs のセルフホスト版はありますか？"
      answerHtml: "お客様のデータを保護することの重要性を理解しています。dbdocs のセルフホスト版をお探しの場合は、こちらの<a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">フォーム</a>にご記入ください。担当者がお客様のご要件についてご連絡いたします。"
    - question: 質問があります。どのように連絡すればよいですか？
      answerHtml: "<a href=\"mailto:dbdiagram{'@'}holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram{'@'}holistics.io</a> までメールをお送りください。"
