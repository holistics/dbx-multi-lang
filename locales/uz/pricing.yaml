  # ========================================
  # Feature Blocks - Pro features
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: Diagramma ko'rinishlari bilan kichikdan boshlang
        description: "Katta o'ylang, kichikdan boshlang. Bitta diagrammaning bir nechta maqsadli ko'rinishlarini yarating. Domen, ish jarayoni yoki jamoa suhbati uchun kerakli jadvallarni ko'rsating."
      passwordProtection:
        title: Parol himoyasi va xususiy rejim
        description: Diagramma va ma'lumotlar bazasi hujjatlariga kirishni parol himoyasi yoki xususiy rejim bilan cheklang. Jamoa ichida ichki ulashish uchun mukammal.
      tableGroups:
        title: Jadval guruhlari bilan yaxshiroq tartibga soling
        description: Oson vizualizatsiya uchun bir nechta jadvallarni birga guruhlang. Ko'p jadvalli ma'lumotlar bazasi bilan ishlashda ish yukingizni kamaytiring.
      headerColors:
        title: Jadval sarlavha ranglari
        description: Jadval sarlavha ranglarini o'zgartirish orqali diagramma va ma'lumotlar bazasi hujjatlaringizni oson boshqaring va rangli qiling!
      detailLevels:
        title: Diagramma tafsilotlari darajalari
        description: "Ehtiyojlaringizga ko'ra barcha ustunlarni ko'rsatish, faqat kalit (PK, FK) ustunlarni ko'rsatish yoki barcha ustunlarni yashirish o'rtasida almashing."
      stickyNotes:
        title: Eslatmalar bilan yaxshiroq hamkorlik qiling
        description: "Tezkor eslatma yoki murakkab g'oyani tushuntirish kerakmi? Eslatmalarni to'g'ridan-to'g'ri diagramma va hujjatlaringizga, kerakli joyga qo'shishingiz mumkin."
      aiAssistant:
        title: AI yordamchisi bilan ish jarayonini tezlashtiring
        description: Aqlli takliflar oling va AI yordamchimiz bilan ma'lumotlar bazasi loyihalash jarayonini tezlashtiring.
      collaboration:
        title: Real vaqtda hamkorlikda tahrirlash
        description: Hamkasblaringizni bitta diagrammada siz bilan real vaqtda ishlashga taklif qiling.
      versionHistory:
        title: Versiyalar tarixi bilan vaqtni qaytaring
        description: Turli sxema versiyalari bilan g'oyalaringizni erkin sinab ko'ring. Istalgan vaqtda oldingi versiyaga qayting.
      schemaChangelog:
        title: Cheksiz sxema o'zgarishlar jurnali tarixi
        description: "Ma'lumotlar bazasi sxemasidagi o'zgarishlarni boshqa hech qachon yo'qotmang. Barcha sxema o'zgarishlariga kiring, 14 kundan eski versiyalarni ko'ring va istalgan ikki versiyani oson solishtiring."
      embeddedViews:
        title: O'rnatilgan ko'rinishlar (Embedded Views)
        description: "Ma'lumotlar bazasi hujjatlaringizni Notion, Confluence, Miro yoki hatto o'z veb-saytingiz kabi platformalarga joylashtirishingiz mumkin. Ma'lumotlar bazasi hujjatlaringizni siz sevgan vositada ko'ring."
      shareWithInvitedUsers:
        title: Taklif qilingan foydalanuvchilar bilan ulashish
        description: "Hamkasblarni loyihangizga to'g'ridan-to'g'ri taklif qiling va boshqaring \u2014 ichki jamoa ulashishi uchun mukammal."
    team:
      collaborativeWorkspace:
        title: Hamkorlik ish maydoni
        description: "Butun jamoa uchun ma'lumotlar bazasi diagrammalari va hujjatlarini saqlash, kirish va ulashish uchun markaziy joy yarating."
      teamManagement:
        title: Jamoa boshqaruvi va hamkorlik
        description: "Jamoadoshlaringizni bitta ish maydonida taklif qiling va boshqaring, hamda ularga Team reja imtiyozlaridan foydalanish imkonini bering."
      unifiedBilling:
        title: Yagona boshqaruv va to'lov
        description: Jamoa a'zolari uchun bir nechta foydalanuvchi litsenziyalarini sotib oling va boshqaring. Foydalanuvchilar va to'lovlarni bir joyda boshqaring.

