  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: Narxlash qanday ishlaydi?
      answerHtml: "&bull; Free reja abadiy mavjud. Personal Pro reja shaxsiy ish maydoningizda dbdiagram va dbdocs bo'ylab Pro xususiyatlarni ochadi.<br><br>&bull; Team reja jamoangizni markazlashtirilgan jamoa ish maydonida dbdiagram va dbdocs bo'ylab hamkorlik qilish uchun birlashtiradi."
    - question: Obunani qanday boshqaraman?
      answerHtml: "Ish maydoningiz obunasini Bosh sahifa > To'lovlar (Billing) bo'limida boshqarishingiz mumkin. Ish maydoningizning \"Bosh sahifa\" yorliqini yuqori o'ng burchakdagi hisob ochiladigan menyusida topishingiz mumkin."
    - question: Kredit karta ma'lumotlarimni saqlaysizmi?
      answerHtml: "Yo'q, biz kredit karta ma'lumotlaringizni to'g'ridan-to'g'ri ko'rib chiqmaymiz. To'lovingizni qayta ishlash uchun Stripe dan foydalanamiz."
    - question: Personal Pro yoki Team rejamni bekor qilsam nima bo'ladi?
      answerHtml: Personal Pro rejani bekor qilganingizdan so'ng, hisobingiz muddat oxirida Free rejaga qaytariladi.
    - question: Rejam avtomatik yangilanadimi?
      answerHtml: Pullik obuna, agar siz obuna muddati tugashidan oldin rejangizni bekor qilmasangiz, avtomatik ravishda yangilanadi.
    - question: Bitta rejada dbdiagram va dbdocs xususiyatlarini olamanmi?
      answerHtml: "Ha, bitta rejada dbdiagram va dbdocs xususiyatlarini olasiz."
    - question: Custom Plan qanday ishlaydi?
      answerHtml: "Custom Plan maxsus ehtiyojlarga ega tashkilotlar uchun moslashtiriladi. Narxlash, maxsus to'lov shartlari va SSO hamda ustuvor qo'llab-quvvatlash kabi korporativ xususiyatlarni muhokama qilish uchun savdo jamoamiz bilan bog'laning."
    - question: "Men xavfsizlik haqida qayg'uraman. dbdocs ning o'z serveringizda joylashtiriladigan versiyasini taklif qilasizmi?"
      answerHtml: "Ma'lumotlaringizni himoya qilish muhimligini tushunamiz. Agar dbdocs ning o'z serveringizda joylashtiriladigan versiyasini izlayotgan bo'lsangiz, ushbu <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">shaklni</a> to'ldiring va jamoamiz maxsus talablaringizni muhokama qilish uchun siz bilan bog'lanadi."
    - question: Savollarim bor. Qanday bog'lanishim mumkin?
      answerHtml: "Bizga <a href=\"mailto:dbdiagram@holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram@holistics.io</a> ga elektron pochta yuboring."
