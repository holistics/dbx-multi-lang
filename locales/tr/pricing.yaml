  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: Fiyatlandırma nasıl çalışır?
      answerHtml: "&bull; Free plan sonsuza kadar kullanılabilir. Personal Pro plan, Kişisel Çalışma Alanınızda dbdiagram ve dbdocs genelinde Pro özelliklerin kilidini açar.<br><br>&bull; Team plan, ekibinizi hem dbdiagram hem de dbdocs üzerinde merkezi bir Takım Çalışma Alanında işbirliği yapmak için bir araya getirir."
    - question: Aboneliğimi nasıl yönetebilirim?
      answerHtml: "Çalışma alanınızın aboneliğini Ana Sayfa > Faturalandırma bölümünden yönetebilirsiniz. Çalışma alanınızın \"Ana Sayfa\" kısayolunu sağ üst köşedeki hesap açılır menüsünde bulabilirsiniz."
    - question: Kredi kartı bilgilerimi saklıyor musunuz?
      answerHtml: "Hayır, kredi kartı bilgilerinizi doğrudan işlemiyoruz. Ödemenizi işlemek için Stripe kullanıyoruz."
    - question: Aboneliğimi iptal edersem ne olur?
      answerHtml: Aboneliğinizi iptal ettiğinizde, çalışma alanınız Free plana döndürülür. Özel projeler herkese açık projelere dönüştürülür ve çalışma alanı üyeleri çalışma alanına erişemez hale gelir.
    - question: Planım otomatik olarak yenilenir mi?
      answerHtml: Ücretli abonelik, abonelik döneminin bitiminden önce planınızı iptal etmediğiniz sürece otomatik olarak yenilenir.
    - question: Tek bir planda hem dbdiagram hem dbdocs özelliklerini alıyor muyum?
      answerHtml: "Evet, aynı planda hem dbdiagram hem de dbdocs özelliklerini alırsınız."
    - question: Custom Plan nasıl çalışır?
      answerHtml: "Custom Plan'lar belirli ihtiyaçları olan kuruluşlar için özelleştirilir. Fiyatlandırma, özel ödeme koşulları ve SSO ile öncelikli destek gibi kurumsal özellikler hakkında görüşmek için satış ekibimizle iletişime geçin."
    - question: "Güvenlik konusunda endişelerim var. dbdocs'un kendi sunucunuzda barındırılan bir sürümünü sunuyor musunuz?"
      answerHtml: "Verilerinizi korumanın önemini anlıyoruz. dbdocs'un kendi sunucunuzda barındırılan bir sürümünü arıyorsanız, bu <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">formu</a> doldurmanız yeterlidir; ekibimiz özel gereksinimlerinizi görüşmek için sizinle iletişime geçecektir."
    - question: Sorularım var. Nasıl iletişime geçebilirim?
      answerHtml: "Bize <a href=\"mailto:dbdiagram{'@'}holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram{'@'}holistics.io</a> adresinden e-posta gönderin."
