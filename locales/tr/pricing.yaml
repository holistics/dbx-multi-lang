  # ========================================
  # Feature Blocks - Pro features
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: Diyagram Görünümleri ile küçük başlayın
        description: "Büyük düşünün, küçük başlayın. Aynı diyagramın birden fazla, odaklanmış görünümünü oluşturun. Bir alan, iş akışı veya ekip görüşmesi için ihtiyacınız olan tabloları gösterin."
      passwordProtection:
        title: Parola Koruması ve Gizli Mod
        description: Diyagramlarınıza ve veritabanı belgelerinize erişimi parola koruması veya gizli mod ile kısıtlayın. Ekip içi paylaşım için idealdir.
      tableGroups:
        title: Tablo Grupları ile daha iyi düzenleyin
        description: Daha kolay görselleştirme için birden fazla tabloyu bir arada gruplayın. Çok sayıda tablo içeren bir veritabanıyla çalışırken iş yükünüzü azaltın.
      headerColors:
        title: Tablo Başlık Renkleri
        description: Tablo başlık renklerini değiştirerek diyagramlarınızı ve veritabanı belgelerinizi kolayca yönetin ve daha renkli hale getirin!
      detailLevels:
        title: Diyagram Detay Seviyeleri
        description: "İhtiyaçlarınıza göre tüm sütunları gösterme, yalnızca anahtar (PK, FK) sütunlarını gösterme veya tüm sütunları gizleme arasında geçiş yapın."
      stickyNotes:
        title: Yapışkan Notlar ile daha iyi işbirliği yapın
        description: "Hızlı bir hatırlatma yazmaya veya karmaşık bir fikri açıklamaya mı ihtiyacınız var? Notları doğrudan diyagramlarınıza ve dokümanlarınıza, tam ihtiyaç duyduğunuz yere ekleyebilirsiniz."
      aiAssistant:
        title: AI Asistan ile iş akışınızı hızlandırın
        description: Akıllı öneriler alın ve yapay zeka destekli asistanımızla veritabanı tasarım iş akışınızı hızlandırın.
      collaboration:
        title: Gerçek Zamanlı İşbirlikçi Düzenleme
        description: Meslektaşlarınızı aynı diyagram üzerinde gerçek zamanlı olarak birlikte çalışmaya davet edin.
      versionHistory:
        title: Sürüm Geçmişi ile zamanda geri gidin
        description: Fikirlerinizi farklı şema sürümleriyle özgürce deneyin. İstediğiniz zaman geçmiş bir sürüme geri dönün.
      schemaChangelog:
        title: Sınırsız Şema Değişiklik Günlüğü geçmişi
        description: "Veritabanı şema değişikliklerinizi bir daha asla kaybetmeyin. Tüm şema değişikliklerine erişin, 14 günden eski sürümlere göz atın ve herhangi iki sürümü kolayca karşılaştırın."
      embeddedViews:
        title: Gömülü Görünümler
        description: "Veritabanı belgelerinizi Notion, Confluence, Miro gibi platformlara veya kendi web sitenize gömebilirsiniz. Veritabanı belgelerinizi zaten sevdiğiniz araçta görün."
      shareWithInvitedUsers:
        title: Davet edilen kullanıcılarla paylaş
        description: "Projenizdeki meslektaşlarınızı doğrudan davet edin ve yönetin\u2014ekip içi paylaşım için idealdir."
    team:
      collaborativeWorkspace:
        title: İşbirlikçi Çalışma Alanı
        description: "Tüm ekibinizin veritabanı diyagramlarını ve belgelerini depolaması, erişmesi ve paylaşması için merkezi bir yer edinin."
      teamManagement:
        title: Ekip Yönetimi ve İşbirliği
        description: "Ekip arkadaşlarınızı tek bir çalışma alanında davet edin ve yönetin, Team planının avantajlarından yararlanmalarını sağlayın."
      unifiedBilling:
        title: Birleşik Yönetim ve Faturalandırma
        description: Ekip üyeleri için birden fazla kullanıcı lisansı satın alın ve yönetin. Kullanıcıları ve faturalandırmayı tek bir yerden yönetin.

