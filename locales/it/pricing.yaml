  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: Come funzionano i prezzi?
      answerHtml: "&bull; Il piano Free è disponibile per sempre. Il piano Personal Pro sblocca le funzionalità Pro su dbdiagram e dbdocs nel tuo spazio di lavoro personale.<br><br>&bull; Il piano Team riunisce il tuo team per collaborare in uno spazio di lavoro Team centralizzato, sia su dbdiagram che su dbdocs."
    - question: Come posso gestire il mio abbonamento?
      answerHtml: "Puoi gestire l'abbonamento del tuo spazio di lavoro in Home > Fatturazione. Puoi trovare il collegamento \"Home\" del tuo spazio di lavoro nel menu a tendina dell'account in alto a destra."
    - question: Conservate i dati della mia carta di credito?
      answerHtml: "No, non gestiamo direttamente i dati della tua carta di credito. Utilizziamo Stripe per elaborare i tuoi pagamenti."
    - question: Cosa succede se annullo il mio piano Personal Pro o Team?
      answerHtml: Dopo l'annullamento del piano Personal Pro, il tuo account verrà ripristinato al piano Free alla fine del periodo.
    - question: Il mio piano verrà rinnovato automaticamente?
      answerHtml: L'abbonamento a pagamento viene rinnovato automaticamente a meno che tu non annulli il piano prima della fine del periodo di abbonamento.
    - question: Ottengo le funzionalità sia di dbdiagram che di dbdocs con un unico piano?
      answerHtml: "Sì, otterrai le funzionalità sia di dbdiagram che di dbdocs con lo stesso piano."
    - question: Come funziona il Custom Plan?
      answerHtml: "I Custom Plan sono personalizzati per organizzazioni con esigenze specifiche. Contatta il nostro team vendite per discutere prezzi, termini di pagamento personalizzati e funzionalità enterprise come SSO e supporto prioritario."
    - question: "Sono preoccupato per la sicurezza. Offrite una versione self-hosted di dbdocs?"
      answerHtml: "Comprendiamo l'importanza di proteggere i tuoi dati. Se stai cercando una versione self-hosted di dbdocs, compila semplicemente questo <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">modulo</a> e il nostro team ti contatterà per discutere le tue esigenze specifiche."
    - question: Ho delle domande. Come posso contattarvi?
      answerHtml: "Scrivici un'email all'indirizzo <a href=\"mailto:dbdiagram{'@'}holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram{'@'}holistics.io</a>."
