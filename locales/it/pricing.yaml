  # ========================================
  # Feature Blocks - Pro features
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: Inizia in piccolo con le Viste del diagramma
        description: "Pensa in grande, inizia in piccolo. Crea molteplici viste focalizzate dello stesso diagramma. Mostra le tabelle necessarie per un dominio, un flusso di lavoro o una conversazione del team."
      passwordProtection:
        title: Protezione con password e modalità privata
        description: Limita l'accesso ai tuoi diagrammi e documenti di database con la protezione tramite password o la modalità privata. Perfetto per la condivisione interna nel team.
      tableGroups:
        title: Organizza meglio con i Gruppi di tabelle
        description: Raggruppa più tabelle insieme per una visualizzazione più semplice. Riduci il carico di lavoro quando lavori con un database che ha molte tabelle.
      headerColors:
        title: Colori dell'intestazione delle tabelle
        description: Gestisci facilmente i tuoi diagrammi e documenti di database cambiando i colori dell'intestazione delle tabelle e rendili più colorati!
      detailLevels:
        title: Livelli di dettaglio del diagramma
        description: "Passa dalla visualizzazione di tutte le colonne, alla visualizzazione delle sole colonne chiave (PK, FK), o persino alla visualizzazione senza colonne, in base alle tue esigenze."
      stickyNotes:
        title: Collabora meglio con le Note adesive
        description: "Hai bisogno di annotare un rapido promemoria o approfondire un'idea complessa? Puoi aggiungere note direttamente ai tuoi diagrammi e documenti, esattamente dove ti servono."
      aiAssistant:
        title: Accelera il flusso di lavoro con l'Assistente IA
        description: Ottieni suggerimenti intelligenti e velocizza il tuo flusso di lavoro di progettazione database con il nostro assistente basato sull'IA.
      collaboration:
        title: Modifica collaborativa in tempo reale
        description: Invita i tuoi colleghi a lavorare sullo stesso diagramma insieme a te in tempo reale.
      versionHistory:
        title: Torna indietro nel tempo con la Cronologia versioni
        description: Sperimenta liberamente le tue idee con diverse versioni dello schema. Ripristina una versione precedente ogni volta che vuoi.
      schemaChangelog:
        title: Cronologia illimitata del Registro modifiche dello schema
        description: "Non perdere mai più traccia delle modifiche allo schema del tuo database. Accedi a tutte le modifiche dello schema, sfoglia versioni precedenti ai 14 giorni e confronta facilmente due versioni qualsiasi."
      embeddedViews:
        title: Viste incorporate
        description: "Puoi incorporare la documentazione del tuo database in piattaforme come Notion, Confluence, Miro o persino nel tuo sito web. Visualizza la documentazione del tuo database nello strumento che già utilizzi."
      shareWithInvitedUsers:
        title: Condividi con utenti invitati
        description: "Invita e gestisci direttamente i colleghi nel tuo progetto: perfetto per la condivisione interna nel team."
    team:
      collaborativeWorkspace:
        title: Spazio di lavoro collaborativo
        description: "Disponi di un luogo centrale in cui tutto il team può archiviare, accedere e condividere diagrammi e documenti di database."
      teamManagement:
        title: Gestione del team e collaborazione
        description: "Invita e gestisci i tuoi compagni di squadra in un unico spazio di lavoro e consenti loro di sfruttare i vantaggi del piano Team."
      unifiedBilling:
        title: Amministrazione e fatturazione unificate
        description: Acquista e gestisci più licenze utente per i membri del team. Gestisci utenti e fatturazione in un unico posto.

