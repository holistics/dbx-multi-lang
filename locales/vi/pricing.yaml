  # ========================================
  # dbdocs Promo boxes
  # ========================================
  promos:
    whiteLabel:
      title: Bạn đang tìm tùy chọn white-label?
      description: Tùy chỉnh tên miền và giao diện dự án tài liệu (logo, giao diện). Tương tự như
      linkText: Bản demo trực tuyến
      ctaText: Liên hệ chúng tôi
    embeddedAnalytics:
      title: "Muốn chia sẻ thông tin chi tiết, không chỉ schema?"
      description: Embedded Analytics. Tích hợp bảng phân tích tùy chỉnh hoàn toàn, mang thương hiệu riêng trực tiếp vào ứng dụng của bạn.
      ctaText: Khám phá ngay
    soc2:
      title: SOC 2 Type II Compliance

  # ========================================
  # Feature Blocks - Pro features
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: Bắt đầu nhỏ với Diagram Views
        description: "Nghĩ lớn, bắt đầu nhỏ. Tạo nhiều chế độ xem tập trung của cùng một sơ đồ. Hiển thị các bảng bạn cần cho một lĩnh vực, quy trình làm việc hoặc cuộc thảo luận nhóm."
      passwordProtection:
        title: Bảo vệ mật khẩu & Chế độ riêng tư
        description: Hạn chế quyền truy cập sơ đồ và tài liệu cơ sở dữ liệu bằng bảo vệ mật khẩu hoặc chế độ riêng tư. Hoàn hảo cho việc chia sẻ nội bộ trong nhóm.
      tableGroups:
        title: Tổ chức tốt hơn với Nhóm bảng
        description: Nhóm nhiều bảng lại với nhau để dễ trực quan hóa hơn. Giảm khối lượng công việc khi làm việc với cơ sở dữ liệu có nhiều bảng.
      headerColors:
        title: Màu tiêu đề bảng
        description: Dễ dàng quản lý sơ đồ và tài liệu cơ sở dữ liệu bằng cách thay đổi màu tiêu đề bảng và làm cho nó thêm sắc màu!
      detailLevels:
        title: Mức độ chi tiết sơ đồ
        description: "Chuyển đổi giữa hiển thị tất cả cột, chỉ hiển thị cột khóa (PK, FK), hoặc ẩn tất cả cột theo nhu cầu của bạn."
      stickyNotes:
        title: Cộng tác tốt hơn với Ghi chú dán
        description: "Cần ghi lại lời nhắc nhanh hoặc giải thích một ý tưởng phức tạp? Bạn có thể thêm ghi chú trực tiếp vào sơ đồ và tài liệu, ngay nơi bạn cần."
      aiAssistant:
        title: Tăng tốc quy trình làm việc với Trợ lý AI
        description: Nhận gợi ý thông minh và tăng tốc quy trình thiết kế cơ sở dữ liệu với trợ lý hỗ trợ bởi AI.
      collaboration:
        title: Chỉnh sửa cộng tác thời gian thực
        description: Mời đồng nghiệp cùng làm việc trên cùng một sơ đồ với bạn trong thời gian thực.
      versionHistory:
        title: Quay ngược thời gian với Lịch sử phiên bản
        description: Tự do thử nghiệm ý tưởng với các phiên bản schema khác nhau. Quay lại phiên bản trước bất cứ khi nào bạn muốn.
      schemaChangelog:
        title: Lịch sử thay đổi Schema không giới hạn
        description: "Không bao giờ mất dấu các thay đổi schema cơ sở dữ liệu. Truy cập tất cả thay đổi schema, duyệt các phiên bản cũ hơn 14 ngày và so sánh hai phiên bản bất kỳ một cách dễ dàng."
      embeddedViews:
        title: Chế độ xem nhúng
        description: "Bạn có thể nhúng tài liệu cơ sở dữ liệu vào các nền tảng như Notion, Confluence, Miro, hoặc thậm chí trang web của bạn. Xem tài liệu cơ sở dữ liệu trong công cụ bạn yêu thích."
      shareWithInvitedUsers:
        title: Chia sẻ với người dùng được mời
        description: "Trực tiếp mời và quản lý đồng nghiệp trong dự án\u2014hoàn hảo cho việc chia sẻ nội bộ nhóm."
    team:
      collaborativeWorkspace:
        title: Không gian làm việc cộng tác
        description: "Có một nơi tập trung để toàn bộ nhóm lưu trữ, truy cập và chia sẻ sơ đồ và tài liệu cơ sở dữ liệu."
      teamManagement:
        title: Quản lý nhóm & Cộng tác
        description: "Mời và quản lý đồng đội trong một không gian làm việc, cho phép họ tận dụng các lợi ích của gói Team."
      unifiedBilling:
        title: Quản trị và thanh toán tập trung
        description: Mua và quản lý nhiều giấy phép người dùng cho các thành viên nhóm. Quản lý người dùng và thanh toán tại một nơi.

