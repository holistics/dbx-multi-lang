  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: Cách tính giá như thế nào?
      answerHtml: "&bull; Gói Free miễn phí mãi mãi. Gói Personal Pro mở khóa các tính năng Pro trên dbdiagram và dbdocs trong Không gian làm việc cá nhân của bạn.<br><br>&bull; Gói Team giúp nhóm của bạn cùng cộng tác trên một Không gian làm việc Team tập trung, trên cả dbdiagram và dbdocs."
    - question: Làm thế nào để quản lý gói đăng ký?
      answerHtml: "Bạn có thể quản lý gói đăng ký của không gian làm việc tại Trang chủ > Thanh toán. Bạn có thể tìm lối tắt \"Trang chủ\" của không gian làm việc trong menu tài khoản góc trên bên phải."
    - question: Bạn có lưu trữ thông tin thẻ tín dụng của tôi không?
      answerHtml: "Không, chúng tôi không xử lý trực tiếp thông tin thẻ tín dụng của bạn. Chúng tôi sử dụng Stripe để xử lý thanh toán."
    - question: Điều gì xảy ra nếu tôi hủy gói Personal Pro hoặc Team?
      answerHtml: Sau khi hủy gói Personal Pro, tài khoản của bạn sẽ được chuyển về gói Free vào cuối kỳ hạn.
    - question: Gói của tôi có được tự động gia hạn không?
      answerHtml: Gói đăng ký trả phí được tự động gia hạn trừ khi bạn hủy gói trước khi kết thúc kỳ đăng ký.
    - question: Tôi có được cả tính năng dbdiagram và dbdocs trong một gói không?
      answerHtml: "Có, bạn sẽ được cả tính năng dbdiagram và dbdocs trong cùng một gói."
    - question: Gói Custom Plan hoạt động như thế nào?
      answerHtml: "Custom Plan được tùy chỉnh cho các tổ chức có nhu cầu đặc biệt. Liên hệ đội ngũ kinh doanh để thảo luận về giá, điều khoản thanh toán tùy chỉnh và các tính năng doanh nghiệp như SSO và hỗ trợ ưu tiên."
    - question: "Tôi lo ngại về bảo mật. Bạn có cung cấp phiên bản tự lưu trữ (self-hosted) của dbdocs không?"
      answerHtml: "Chúng tôi hiểu tầm quan trọng của việc bảo vệ dữ liệu của bạn. Nếu bạn đang tìm phiên bản tự lưu trữ của dbdocs, hãy điền vào <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">biểu mẫu</a> này, và đội ngũ của chúng tôi sẽ liên hệ để thảo luận về yêu cầu cụ thể của bạn."
    - question: Tôi có câu hỏi. Làm thế nào để liên hệ?
      answerHtml: "Gửi email cho chúng tôi tại <a href=\"mailto:dbdiagram{'@'}holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram{'@'}holistics.io</a>."
