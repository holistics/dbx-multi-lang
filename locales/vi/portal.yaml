        retry: "Thử lại"
        single: "Personal Pro sẽ được áp dụng cho {name}."
        singleLegacyPersonal: "Personal Pro sẽ được áp dụng cho Không gian làm việc cá nhân của bạn."
        legacyPersonalLabel: "Không gian làm việc cá nhân"
        createsNew: "Chúng tôi sẽ tạo một không gian làm việc miễn phí mới cho bạn và áp dụng Personal Pro cho không gian đó."
    status:
      statusLabel: "Trạng thái"
      expiresOn: "Hết hạn vào {date}"
      reviewNoteLabel: "Lý do được nêu"
      pending:
        label: "Đang xem xét"
        point1: "Chúng tôi đã nhận được đơn đăng ký gói Education của bạn. Tuy nhiên, chúng tôi không thể tự động khớp tên miền email của bạn với một trường học, nên một đồng nghiệp đang kiểm tra thủ công."
        point2: "Chúng tôi sẽ gửi email cho bạn trong vài ngày làm việc. Hiện tại bạn không cần làm gì thêm."
      approved:
        label: "Đã duyệt"
        point1: "Tin vui, đơn đăng ký gói Education của bạn đã được duyệt. Chúng tôi đang chuyển không gian làm việc của bạn sang Personal Pro, thường mất chưa đến một giờ."
        point2: "Chúng tôi sẽ gửi email cho bạn ngay khi gói được kích hoạt."
      active:
        label: "Đang hoạt động"
        point1: "Không gian làm việc của bạn đang dùng Personal Pro thông qua gói Education."
        point2: "Chúng tôi sẽ nhắc bạn hai tuần trước khi hết hạn. Sau khi hết hạn, bạn có thể đăng ký lại."
      expired:
        label: "Đã kết thúc"
        point1: "Gói Education của bạn đã kết thúc nên không gian làm việc của bạn đã quay về gói miễn phí. Mọi thứ bạn đã tạo vẫn còn nguyên."
        point2: "Vẫn đang học hoặc giảng dạy? Bạn có thể đăng ký lại bên dưới."
      rejected:
        label: "Không được duyệt"
        point1: "Cảm ơn bạn đã đăng ký. Rất tiếc, chúng tôi không thể xác nhận mối liên hệ của bạn với một trường học hoặc đại học."
        point2: "Nếu bạn cho rằng chúng tôi nhầm, hãy trả lời email chúng tôi đã gửi kèm tài liệu chứng minh mối liên hệ của bạn, chúng tôi sẽ xem xét lại."
      revoked:
        label: "Đã thu hồi"
        point1: "Chúng tôi đã thu hồi gói Education của bạn, nên không gian làm việc của bạn không còn dùng Personal Pro thông qua gói này."
        point2: "Nếu bạn cho rằng đây là nhầm lẫn, vui lòng liên hệ với chúng tôi và chúng tôi sẽ xem xét lại."
