  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: 定价如何运作？
      answerHtml: "&bull; Free 方案永久可用。Personal Pro 方案可在你的个人工作区中解锁 dbdiagram 和 dbdocs 的专业功能。<br><br>&bull; Team 方案将你的团队聚集在一起，在集中的团队工作区中协作，同时涵盖 dbdiagram 和 dbdocs。"
    - question: 如何管理我的订阅？
      answerHtml: "你可以在主页 > 计费中管理工作区的订阅。你可以在右上角的账户下拉菜单中找到工作区的\"主页\"快捷方式。"
    - question: 你们会存储我的信用卡信息吗？
      answerHtml: "不会，我们不直接处理你的信用卡信息。我们使用 Stripe 来处理你的付款。"
    - question: 如果我取消 Personal Pro 或 Team 方案会怎样？
      answerHtml: 取消 Personal Pro 方案后，你的账户将在当前期限结束时恢复为 Free 方案。
    - question: 我的方案会自动续费吗？
      answerHtml: 付费订阅会自动续费，除非你在订阅期结束前取消方案。
    - question: 一个方案是否同时包含 dbdiagram 和 dbdocs 功能？
      answerHtml: "是的，你将在同一个方案中获得 dbdiagram 和 dbdocs 的功能。"
    - question: Custom Plan 如何运作？
      answerHtml: "Custom Plan 为有特定需求的组织量身定制。联系我们的销售团队讨论定价、自定义付款条款以及 SSO 和优先支持等企业功能。"
    - question: "我很关注安全问题。你们是否提供 dbdocs 的自托管版本？"
      answerHtml: "我们理解保护你数据的重要性。如果你正在寻找 dbdocs 的自托管版本，只需填写此<a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">表单</a>，我们的团队将与你联系，讨论你的具体需求。"
    - question: 我有问题，如何联系你们？
      answerHtml: "请发送邮件至 <a href=\"mailto:dbdiagram@holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram@holistics.io</a>。"
