      headerColors:
        title: Cores do Cabeçalho de Tabelas
        description: Gerencie facilmente seus diagramas e documentos de banco de dados alterando as cores do cabeçalho das tabelas e deixe tudo mais colorido!
      detailLevels:
        title: Níveis de Detalhe do Diagrama
        description: "Alterne entre exibir todas as colunas, exibir apenas colunas-chave (PK, FK) ou até ocultar todas as colunas de acordo com suas necessidades."
      stickyNotes:
        title: Colabore melhor com Notas Adesivas
        description: "Precisa anotar um lembrete rápido ou elaborar uma ideia complexa? Você pode adicionar notas diretamente aos seus diagramas e documentos, exatamente onde você precisa."
