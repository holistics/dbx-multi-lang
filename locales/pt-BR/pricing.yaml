        description: "Nunca mais perca o controle das alterações no esquema do seu banco de dados. Acesse todas as alterações de esquema, navegue por versões com mais de 14 dias e compare quaisquer duas versões com facilidade."
      embeddedViews:
        title: Visualizações Incorporadas
        description: "Você pode incorporar a documentação do seu banco de dados em plataformas como Notion, Confluence, Miro ou até mesmo no seu próprio site. Veja a documentação do seu banco de dados na ferramenta que você já adora."
      shareWithInvitedUsers:
