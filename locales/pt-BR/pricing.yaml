  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: Como funciona o preço?
      answerHtml: "&bull; O plano Free está disponível para sempre. O plano Personal Pro desbloqueia recursos Pro no dbdiagram e dbdocs no seu Espaço de Trabalho Pessoal.<br><br>&bull; O plano Team reúne sua equipe para colaborar em um Espaço de Trabalho Team centralizado, tanto no dbdiagram quanto no dbdocs."
    - question: Como posso gerenciar minha assinatura?
      answerHtml: "Você pode gerenciar a assinatura do seu espaço de trabalho em Início > Faturamento. Você encontra o atalho \"Início\" do seu espaço de trabalho no menu suspenso da conta no canto superior direito."
    - question: Vocês armazenam as informações do meu cartão de crédito?
      answerHtml: "Não, nós não manipulamos as informações do seu cartão de crédito diretamente. Usamos o Stripe para processar seu pagamento."
    - question: O que acontece se eu cancelar meu plano Personal Pro ou Team?
      answerHtml: Após cancelar o plano Personal Pro, sua conta será revertida para o plano Free ao final do período.
    - question: Meu plano será renovado automaticamente?
      answerHtml: A assinatura paga é renovada automaticamente, a menos que você cancele seu plano antes do final do período da assinatura.
    - question: Eu recebo os recursos do dbdiagram e do dbdocs em um único plano?
      answerHtml: "Sim, você terá os recursos do dbdiagram e do dbdocs no mesmo plano."
    - question: Como funciona o Custom Plan?
      answerHtml: "Os Custom Plans são personalizados para organizações com necessidades específicas. Entre em contato com nossa equipe de vendas para discutir preços, termos de pagamento personalizados e recursos empresariais como SSO e suporte prioritário."
    - question: "Estou preocupado com a segurança. Vocês oferecem uma versão auto-hospedada do dbdocs?"
      answerHtml: "Entendemos a importância de proteger seus dados. Se você está procurando uma versão auto-hospedada do dbdocs, basta preencher este <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">formulário</a>, e nossa equipe entrará em contato para discutir seus requisitos específicos."
    - question: Tenho perguntas. Como posso entrar em contato?
      answerHtml: "Envie-nos um e-mail para <a href=\"mailto:dbdiagram{'@'}holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram{'@'}holistics.io</a>."
