  # ========================================
  # Section FAQ
  # ========================================
  faq:
    - question: Comment fonctionne la tarification ?
      answerHtml: "&bull; Le plan Free est disponible pour toujours. Le plan Personal Pro débloque les fonctionnalités Pro sur dbdiagram et dbdocs dans votre espace de travail personnel.<br><br>&bull; Le plan Team rassemble votre équipe pour collaborer sur un espace de travail Team centralisé, sur dbdiagram et dbdocs."
    - question: Comment puis-je gérer mon abonnement ?
      answerHtml: "Vous pouvez gérer l'abonnement de votre espace de travail dans Accueil > Facturation. Vous trouverez le raccourci \"Accueil\" dans le menu déroulant du compte en haut à droite."
    - question: Conservez-vous mes informations de carte bancaire ?
      answerHtml: "Non, nous ne traitons pas directement vos informations de carte bancaire. Nous utilisons Stripe pour traiter vos paiements."
    - question: Que se passe-t-il si j'annule mon plan Personal Pro ou Team ?
      answerHtml: Après l'annulation du plan Personal Pro, votre compte sera rétrogradé au plan Free à la fin de la période en cours.
    - question: Mon plan sera-t-il automatiquement renouvelé ?
      answerHtml: L'abonnement payant est automatiquement renouvelé sauf si vous annulez votre plan avant la fin de la période d'abonnement.
    - question: Est-ce que j'obtiens les fonctionnalités dbdiagram et dbdocs avec un seul plan ?
      answerHtml: "Oui, vous bénéficiez des fonctionnalités dbdiagram et dbdocs avec le même plan."
    - question: Comment fonctionne le Custom Plan ?
      answerHtml: "Les Custom Plans sont adaptés aux organisations ayant des besoins spécifiques. Contactez notre équipe commerciale pour discuter de la tarification, des conditions de paiement personnalisées et des fonctionnalités entreprise comme le SSO et le support prioritaire."
    - question: "La sécurité me préoccupe. Proposez-vous une version auto-hébergée de dbdocs ?"
      answerHtml: "Nous comprenons l'importance de la protection de vos données. Si vous recherchez une version auto-hébergée de dbdocs, remplissez simplement ce <a href=\"https://form.jotform.com/240041567989466\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">formulaire</a>, et notre équipe vous contactera pour discuter de vos besoins spécifiques."
    - question: J'ai des questions. Comment puis-je vous contacter ?
      answerHtml: "Envoyez-nous un e-mail à <a href=\"mailto:dbdiagram@holistics.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"dui-pricing-faq__link underline\">dbdiagram@holistics.io</a>."
