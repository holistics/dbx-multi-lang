  # Page de tarification - Titres principaux
  # ========================================
  landing:
    badge: Un seul plan pour dbdiagram et dbdocs # Badge au-dessus du titre
    title: Mettez à niveau votre espace de travail # Titre de la page
    subtitle: Chaque plan payant inclut dbdiagram et dbdocs ensemble. # Sous-titre

  # ========================================
  # Sélecteur de facturation - Mensuel/Annuel
  # ========================================
  billingToggle:
    monthly: Mensuel # Libellé gauche
    annual: Annuel # Libellé droit
    saveUpTo: "Économisez jusqu'à {percent} %" # Texte du badge d'économie

  # ========================================
  # Noms des plans
  # ========================================
  planNames:
    free: Free # Nom du plan Free
    personalPro: Personal Pro # Nom du plan Personal Pro
    team: Team # Nom du plan Team
    customPlan: Custom Plan # Nom du plan Enterprise/Custom

  # ========================================
  # Accroches des plans
  # ========================================
