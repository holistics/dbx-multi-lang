# Traductions de la tarification - Page de tarification publique, cartes de plans, comparaison des fonctionnalités, FAQ
# Zones de l'interface : page de tarification, cartes de plans, blocs de fonctionnalités, tableau comparatif, promotions dbdocs

pricing:
