  # ========================================
  # Blocs de fonctionnalités - Fonctionnalités Pro
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: Commencez petit avec les vues de diagrammes
        description: "Voyez grand, commencez petit. Créez plusieurs vues ciblées du même diagramme. Affichez les tables dont vous avez besoin pour un domaine, un flux de travail ou une discussion d'équipe."
      passwordProtection:
        title: Protection par mot de passe et mode privé
        description: Restreignez l'accès à vos diagrammes et documents de base de données avec la protection par mot de passe ou le mode privé. Idéal pour le partage interne au sein de l'équipe.
      tableGroups:
        title: Mieux organiser avec les groupes de tables
        description: Regroupez plusieurs tables pour une visualisation plus facile. Réduisez votre charge de travail lorsque vous travaillez avec une base de données comportant de nombreuses tables.
      headerColors:
        title: Couleurs d'en-tête de table
        description: Gérez facilement vos diagrammes et documents de base de données en changeant les couleurs d'en-tête et rendez-les plus colorés !
      detailLevels:
        title: Niveaux de détail du diagramme
        description: "Basculez entre l'affichage de toutes les colonnes, l'affichage des colonnes clés (PK, FK) uniquement, ou même le masquage de toutes les colonnes selon vos besoins."
      stickyNotes:
        title: Collaborez mieux avec les notes autocollantes
        description: "Besoin de noter un rappel rapide ou de développer une idée complexe ? Vous pouvez ajouter des notes directement à vos diagrammes et documents, là où vous en avez besoin."
      aiAssistant:
        title: Accélérez votre flux de travail avec l'assistant IA
        description: Obtenez des suggestions intelligentes et accélérez votre flux de travail de conception de bases de données avec notre assistant alimenté par l'IA.
      collaboration:
        title: Édition collaborative en temps réel
        description: Invitez vos collègues à travailler sur le même diagramme avec vous en temps réel.
      versionHistory:
        title: Remontez le temps avec l'historique des versions
        description: Expérimentez librement vos idées avec différentes versions de schéma. Revenez à une version précédente quand vous le souhaitez.
      schemaChangelog:
        title: Historique illimité des modifications du schéma
        description: "Ne perdez plus jamais le fil des modifications de votre schéma de base de données. Accédez à toutes les modifications, parcourez les versions de plus de 14 jours et comparez facilement deux versions."
      embeddedViews:
        title: Vues intégrées
        description: "Vous pouvez intégrer votre documentation de base de données dans des plateformes comme Notion, Confluence, Miro, ou même votre propre site web. Consultez votre documentation de base de données dans l'outil que vous utilisez déjà."
      shareWithInvitedUsers:
        title: Partager avec les utilisateurs invités
        description: "Invitez et gérez directement vos collègues dans votre projet\u2014idéal pour le partage interne en équipe."
    team:
      collaborativeWorkspace:
        title: Espace de travail collaboratif
        description: "Disposez d'un espace centralisé pour que toute votre équipe puisse stocker, accéder et partager vos diagrammes et documents de base de données."
      teamManagement:
        title: Gestion d'équipe et collaboration
        description: "Invitez et gérez vos coéquipiers dans un seul espace de travail, et permettez-leur de profiter des avantages du plan Team."
      unifiedBilling:
        title: Administration et facturation unifiées
        description: Achetez et gérez plusieurs licences utilisateur pour les membres de l'équipe. Gérez les utilisateurs et la facturation en un seul endroit.

