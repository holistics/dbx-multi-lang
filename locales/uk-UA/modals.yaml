    confirmMessage: "Ви хочете передати право власності на цю діаграму учаснику <b>{memberLabel}</b>?" # Confirmation dialog message
    success: Право власності на діаграму передано учаснику {memberLabel} # Success toast
    error: Не вдалося передати право власності на діаграму. Спробуйте ще раз. # Error toast