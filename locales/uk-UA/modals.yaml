# Modals translations - Modal dialogs throughout the app
# UI Areas: Share modal, Import modal, Export modal, History modal, Upgrade modals

modals:
  # ========================================
  # Generic modal titles - Common titles
  # ========================================
  titles:
    confirm: Підтвердити # Generic confirm modal title
    delete: Видалити # Delete confirmation modal title
    remove: Вилучити # Remove confirmation modal title
    rename: Перейменувати # Rename modal title

  # ========================================
  # Confirmation dialogs - Generic and specific
  # ========================================
  confirmation:
    default:
      message: Ви справді хочете продовжити цю дію? # Default confirmation message
      checkbox: Більше не показувати це повідомлення # Checkbox to disable future confirmations
    deleteDiagram:
      message: Ви впевнені, що хочете видалити цю діаграму? Цю дію неможливо скасувати. # Delete diagram warning
      warning: Зверніть увагу: цю дію неможливо скасувати! # Additional warning
      embedLinkActive: У вас є активне вбудоване посилання. # Warning about embed links
      lastViewed: Останній перегляд # Label for last viewed timestamp
    removeWorkspace:
    removeMember:
      title: Вилучити учасника # Remove member modal title
      message: Ви впевнені, що хочете вилучити цього учасника з робочого простору? # Remove member confirmation
      suggestion: Введіть свою електронну пошту для підтвердження. # Input prompt for confirmation

  # ========================================
  # Share modal - Diagram sharing
  # ========================================
  share:
    tabs:
      sharing: Спільний доступ # Sharing tab label
      embedding: Вбудовування # Embedding tab label
    generalAccess:
      passwordPlaceholder: Введіть пароль # Password input placeholder
      createPassword: Створити # Create password button
      updatePassword: Оновити # Update password button
      canAccess: має доступ # Helper text suffix
      copyLink: Копіювати посилання # Copy link button
      updatePasswordButton: Оновити пароль # Update password button
    permissions:
      canEditAndInvite: Може редагувати та запрошувати # Permission label
      canEditAndInviteDesc: Може редагувати та запрошувати людей. # Permission description
      canEdit: Може редагувати # Permission label
      canEditDesc: Може редагувати, але не може запрошувати людей. # Permission description
      canView: Може переглядати # Permission label
      canViewDesc: Може переглядати, але не редагувати. # Permission description
      remove: Вилучити # Remove button
      removeDesc: Вилучити цього співавтора. # Remove description
      noAccess: Немає доступу # No access label
      noAccessDesc: Немає доступу до цієї діаграми # No access description
      transferOwnership: Передати право власності # Transfer ownership permission label
      transferOwnershipDesc: Передати право власності на цю діаграму # Transfer ownership permission description
    invite:
      placeholder: Електронні адреси через кому або пробіл # Email input placeholder
      button: Запросити # Invite button
    members:
      you: (ви) # Label for current user
    confirmRemoveCollaborator: "Ви збираєтеся вилучити <b>{email}</b> зі списку співавторів, підтвердьте цю дію!" # Remove confirmation message
    errors:
      publicPermissionUpdateFailed: Не вдалося оновити публічний доступ до діаграми, спробуйте ще раз! # Error toast
      publicPermissionUpdated: Публічний доступ до діаграми оновлено! # Success toast
      passwordLength: Пароль має містити від 6 до 128 символів # Validation error
      cannotUpdateDiagramState: Не вдалося оновити стан діаграми # Error toast
      createPasswordFailed: Не вдалося створити пароль # Error toast
      updatePasswordFailed: Не вдалося оновити пароль # Error toast
    success:
      createPasswordSuccess: Пароль успішно створено # Success toast for password creation
      updatePasswordSuccess: Пароль успішно оновлено # Success toast for password update
      diagramIsPublic: Тепер діаграма публічна! # Success toast for making diagram public
      diagramIsPrivate: Тепер діаграма приватна! # Success toast for making diagram private
      diagramIsProtected: Тепер діаграма захищена! # Success toast for making diagram protected
    permissionChanged: Ваші дозволи змінено, перезавантажте сторінку, щоб застосувати зміни! # Permission change toast
    reload: Перезавантажити # Reload button
    cannotGetPermission: Не вдалося отримати дозвіл діаграми, спробуйте ще раз! # Error toast
    embedLink:
      title: Вбудоване посилання # Embed link section title
      lastView: Останній перегляд # Last viewed label
      customize: Налаштуйте вбудоване посилання за допомогою параметрів # Customize label
      darkMode: Темний режим # Dark mode toggle label
      highlightRelationships: Підсвічувати зв'язки # Highlight toggle label
      detailLevel: Рівень деталізації # Detail level dropdown label
      anyoneWithLink: Будь-хто, хто має посилання, може переглядати вбудовану діаграму. # Help text
      remove: Ви хочете вилучити це вбудоване посилання? Інші люди більше не зможуть отримати до нього доступ. # Remove confirmation
      generate: Створити вбудоване посилання # Generate button
      errors:
        cannotGet: Не вдалося отримати вбудовані посилання, спробуйте ще раз! # Error toast
        cannotCreate: Не вдалося створити вбудоване посилання, спробуйте ще раз! # Error toast
        cannotDelete: Не вдалося видалити вбудоване посилання, спробуйте ще раз! # Error toast
        cannotUpdate: Не вдалося оновити налаштування вбудованого посилання, спробуйте ще раз! # Error toast
    tooltip:
      viewOnly: Цей дозвіл користувача обмежено лише переглядом. # Permission tooltip
      upgradePersonal: Щоб увімкнути спільне редагування, покращіть тарифний план свого особистого робочого простору. # Upgrade tooltip
      freeAccount: У цього користувача <b>безкоштовний</b> обліковий запис. # Free account tooltip
      editAfterUpgrade: Після покращення тарифного плану користувач зможе <b>редагувати</b> діаграму. # Upgrade tooltip
      collaborationLimit: Ви можете співпрацювати лише з # Collaboration limit text
      diagramLimit: До 4 безкоштовних користувачів у кожній діаграмі (зараз {count} користувачів) # Diagram limit text
      workspaceLimit: До 6 безкоштовних користувачів у всіх діаграмах (зараз {count} користувачів) # Workspace limit text

  # ========================================
  # Private diagram - Password protection
  # ========================================
  private:
    protected: Захищена діаграма # Protected badge
    private: Ця діаграма приватна # Private badge
    passwordRequired: Для перегляду цієї діаграми потрібен пароль. # Password required message
    noAccess: Ви не маєте доступу до цієї діаграми. # No access message
    enterPassword: Введіть свій пароль # Password input placeholder
    incorrectPassword: Неправильний пароль # Incorrect password error
    tryAgain: Спробуйте ще раз! # Try again button
    viewDiagram: Переглянути діаграму # View diagram button

  # ========================================
  # Publish modal - Publish to DBDocs
  # ========================================
  publish:
    title: Опублікувати в # Modal title (publish dropdown)
    reviewAndPublishTitle: Переглянути та опублікувати в # Modal title for review and publish modal
    dbdocsLink: dbdocs # Link label
    cancelButton: Скасувати # Cancel button
    publishButton: Опублікувати # Publish button
    reviewAndPublishButton: Переглянути та опублікувати # Publish button
    bullet1: Опублікувати доступну в інтернеті документацію бази даних для вашої діаграми. # Feature bullet point
    bullet2: Опублікований документ буде доступний в обліковому записі dbdocs, пов'язаному з вашою електронною поштою. # Feature bullet point
    bullet3: Зміни у вашій діаграмі не оновлюватимуть документ dbdocs автоматично. # Feature bullet point
    publishNewOrUpdate: Опублікувати новий документ / Оновити наявний # Section title
    updateExisting: Оновити наявний документ # Update option
    publishNewOption: Опублікувати новий документ # Publish a new document option
    projectPublicDefault: Ваш проєкт dbdocs за замовчуванням має статус "public". Люди можуть отримати доступ за його посиланням. # Public default info
    documentProjectName: Назва документа проєкту  # Project name field label
    enterProjectName: Введіть назву проєкту # Project name placeholder
    options: Параметри # Options section title
    ownerOnlyUpdatePublishDestination: Лише власник діаграми може змінювати місце призначення документа # Non-owner message for selecting publish destination
    passwordProtection: Захист паролем (необов'язково) # Password section title
    passwordPlaceholder: Введіть пароль # Password placeholder
    passwordMinLength: Пароль має містити щонайменше 6 символів # Password validation
    feedback: Повідомте нам # Feedback label
    feedbackLink: відгук # Feedback link
    aboutThisFeature: про цю функцію! # Feedback link suffix
    errorLoadingProjects: Сталася помилка під час завантаження опублікованих проєктів, зверніться до нашої служби підтримки за адресою dbdiagram{'@'}holistics.io # Error toast
    errorPublishing: Сталася помилка під час публікації проєкту, зверніться до нашої служби підтримки за адресою dbdiagram{'@'}holistics.io # Error toast
    projectNameEmpty: Назва проєкту не може бути порожньою # Validation error
    projectNameInvalid: Назва проєкту може містити лише літери, цифри, пробіл, "-" або "_" # Validation error
    projectNameExists: Проєкт із такою назвою/URL уже існує. Виберіть іншу назву. # Validation error for duplicate name/url
    passwordInvalid: Недійсний пароль, спробуйте ще раз! # Validation error
    editFromDbdocsInfo: Редагувати опублікований проєкт можна безпосередньо в dbdocs. # Info about editing from dbdocs
    learnMore: Докладніше # Learn more link text
    ownerOnlyPublish: Лише власник діаграми може опублікувати новий проєкт у dbdocs. # Non-owner message
    publishedProject: Опублікований проєкт # Label for published project
    viewExistingProjects: Переглянути наявні проєкти # Link to view existing projects popover
    projectNameHeader: Назва # Header for project name column in popover
    projectUrlHeader: URL # Header for project URL column in popover
    publishNewQuestion: Хочете зробити публікацію в іншому проєкті? # Prompt to publish to a new project
    publishNewAction: Опублікувати в новому проєкті# Action link text
    resolveConflictsAndErrorsBeforePublish: Усуньте всі конфлікти та помилки перед публікацією. # Hint to resolve all conflicts and errors before publishing
    currentChange: Поточна зміна # Current change conflict marker text
    incomingChange: Вхідна зміна # Incoming change conflict marker text
    bothChanges: Обидві зміни # Both change conflict marker text
    acceptChangeButton: Прийняти {conflictTypeText} # Accept change button
    acceptAllIncomingChangesButton: Прийняти всі вхідні зміни # Accept all incoming changes button
    conflictWordSingular: конфлікт # Word for counting conflicts
    conflictWordPlural: конфлікти # Word for counting conflicts

  # ========================================
  # Import modal - Import diagram
  # ========================================
  import:
    instructions: Інструкції # Instructions section title
    showInstructions: Показати інструкції # Show instructions button
    hideInstructions: Приховати інструкції # Hide instructions button
    upload: Завантажити {file} # Upload button label
    appendMode: Дописати перетворений DBML у кінець # Append mode toggle
    modal:
      validating: Перевірка # Validating modal title
    dbConnection:
      title: Згенерувати DBML із прямого підключення до бази даних # CLI import modal title
      intro1: Цей метод безпосередньо підключається до вашої бази даних і зчитує її схему (зазвичай із INFORMATION_SCHEMA), щоб згенерувати код DBML. # Intro text part 1
      intro2: Усе виконується на вашому локальному комп'ютері, а облікові дані бази даних не відстежуються й нікуди не надсилаються. # Intro text part 2
      intro3: Програма має відкритий вихідний код у # Intro text part 3
      intro3Link: і його можна перевірити # Link text
      step1: 1. Встановіть # Step 1 label
      step1Note: можливо, вам потрібно буде додати # Note text
      step1NoteSudo: перед командами в Linux # Sudo note
      step2: 2. Виконайте таку команду # Step 2 label
      exampleFor: Приклад для # Example label
      successMessage: 'Згенеровано файл DBML із підключення до бази даних: database.dbml' # Success message
      successBigquery: 'Примітка: для BigQuery файл облікових даних JSON має містити такі ключі' # BigQuery note
      successSnowflake1: Спроба підключення... # Snowflake step 1
      successSnowflake2: Виконання запиту... # Snowflake step 2
      successSnowflake3: Запит успішно виконано. # Snowflake step 3
      successSnowflake4: Підключення успішно закрито. # Snowflake step 4
      step3: 3. Скопіюйте та вставте створений DBML у панель коду, щоб візуалізувати базу даних. # Step 3 label
      databaseTypes:
        mysql: MySQL # Database type label
        postgres: PostgreSQL # Database type label
        mssql: SQL Server # Database type label
        oracle: Oracle # Database type label
        snowflake: Snowflake # Database type label
        bigquery: BigQuery # Database type label

  # ========================================
  # Upgrade modals - Feature upgrade prompts
  # ========================================
  upgrade:
    titles:
      createDiagram: Ви досягли ліміту кількості діаграм! # Diagram limit title
      detailLevels: Ви виявили платну функцію! # Detail levels title
      detailLevelsDbdocs: Ви виявили функцію платних проєктів! # DBDocs detail levels title
      diagramView: Створення додаткових подань є платною функцією # Diagram view title
      headerColor: Ви виявили платну функцію! # Header color title
      headerColorDbdocs: Ви виявили функцію платних проєктів! # DBDocs header color title
      privateDiagram: Ви виявили платну функцію! # Private diagram title
      stickyNotes: Ви виявили платну функцію! # Sticky notes title
      stickyNotesDbdocs: Ви виявили функцію платних проєктів! # DBDocs sticky notes title
      versionHistory: Ви виявили платну функцію! # Version history title
      aiAssistant: Помічник dbdiagram AI є платною функцією # AI assistant title
      tableGroup: Ви виявили платну функцію! # Table group title
      tableGroupDbdocs: Ви виявили функцію платних проєктів! # DBDocs table group title
      invitePeople: Ви виявили платну функцію! # Invite people title
    descriptions:
      createDiagram: Перейдіть на платний тарифний план, щоб отримати <b>необмежену<br>кількість створених діаграм</b> та інші розширені функції! # Description
      detailLevels: Перейдіть на платний тариф, щоб отримати Detail Levels, Header Color,<br>Table Group і доступ до всіх майбутніх функцій! # Description
      detailLevelsDbdocs: Оновіть свій проєкт, щоб отримати Detail Levels, Header Color,<br>Table Group і доступ до всіх майбутніх функцій! # DBDocs description
      diagramView: На безкоштовному тарифі можна зберігати лише подання за замовчуванням.<br>Перейдіть на платний тариф, щоб отримати <b>необмежену кількість подань діаграм</b> та інші розширені функції! # Description
      headerColor: Перейдіть на платний тариф, щоб отримати Detail Levels, Header Color,<br>Relationship Color, Table Group і доступ до всіх майбутніх функцій! # Description
      headerColorDbdocs: Оновіть свій проєкт, щоб отримати Detail Levels, Header Color,<br>Relationship Color, Table Group і доступ до всіх майбутніх функцій! # DBDocs description
      privateDiagram: Перейдіть на платний тариф, щоб захистити свої діаграми за допомогою<br><strong>захисту паролем і приватного режиму</strong> та інших розширених функцій! # Description
      stickyNotes: Перейдіть на платний тариф, щоб додати<strong> стікери </strong>до своєї діаграми<br>та скористатися іншими розширеними функціями! # Description
      stickyNotesDbdocs: Оновіть свій проєкт, щоб додати<strong> стікери </strong>до своєї діаграми<br>та скористатися іншими розширеними функціями! # DBDocs description
      versionHistory: Вільно експериментуйте з ідеями, використовуючи різні <b>версії схеми</b>.<br>За потреби повертайтеся до попередньої версії. # Description
      aiAssistant: Перейдіть на платний тариф, щоб проєктувати й оптимізувати схеми баз даних<br>за допомогою <strong>помічника на основі ШІ з підтримкою природної мови</strong> # Description
      tableGroup: Перейдіть на платний тариф, щоб отримати Detail Levels, Header Color,<br>Table Group і доступ до всіх майбутніх функцій! # Description
      tableGroupDbdocs: Оновіть свій проєкт, щоб отримати Detail Levels, Header Color,<br>Table Group і доступ до всіх майбутніх функцій! # DBDocs description
      invitePeople: Перейдіть на платний тариф, щоб співпрацювати над проєктуванням ER-діаграм за допомогою<br><strong>запрошення співавторів і публікації редагованих діаграм</strong> та інших розширених функцій! # Description
    buttons:
      viewPlans: Переглянути тарифи # View plans button
      upgradeProject: Оновити проєкт # Upgrade project button

