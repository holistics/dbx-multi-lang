  # Transfer ownership modal
  # ========================================
  transferOwnership:
    title: Передати право власності # Modal title
    subtitle: "Виберіть учасника, якому передати право власності:" # Subtitle below the title
    searchPlaceholder: Шукати за ім'ям або електронною поштою... # Search input placeholder
    noMembersFound: Учасників не знайдено. # Empty state when search has no results
    transferButton: Передати # Confirm transfer button
    notes:
      irreversible: Цю дію неможливо скасувати. # Warning note
