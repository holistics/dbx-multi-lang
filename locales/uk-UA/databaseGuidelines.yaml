# Database Guidelines translations - Import instructions
# UI Areas: Import modal, Database connection instructions

databaseGuidelines:
  # ========================================
  # MySQL Import - MySQL-specific instructions
  # ========================================
  mysql:
    title: MySQL # Database selector option (import modal)
    install: Встановити # Install link text
    tool: mysqldump # Tool name
    terminalCommand: Виконайте в терміналі цю команду # Instruction (command block)
    linuxPrefix: На Linux може знадобитися додати # Linux-specific note
    sudo: sudo # Sudo command
    linuxSuffix: перед нею # Sudo placement hint
    example: Приклад # Command block label
    step3: Скопіюйте отриманий вивід SQL і вставте його в це модальне вікно # Final step instruction

  # ========================================
  # PostgreSQL Import - PostgreSQL-specific instructions
  # ========================================
  postgres:
    title: PostgreSQL # Database selector option (import modal)
    install: Встановити # Install link text
    tool: pg_dump # Tool name
    terminalCommand: Виконайте в терміналі цю команду # Instruction (command block)
    linuxPrefix: На Linux може знадобитися додати # Linux-specific note
    sudo: sudo # Sudo command
    linuxSuffix: перед нею # Sudo placement hint
    example: Приклад # Command block label
    step3: Скопіюйте отриманий вивід SQL і вставте його в це модальне вікно # Final step instruction

  # ========================================
  # CSV Import - CSV file instructions
  # ========================================
  csv:
    title: CSV # Database selector option (import modal)
    description: Завантажте файл CSV, щоб автоматично створити структуру таблиці DBML. Перший рядок має містити заголовки стовпців # Import description
    exampleFormat: Приклад формату CSV # Example section header

  # ========================================
  # Rails Import - Rails schema.rb instructions
  # ========================================
  rails:
    title: Rails schema.rb # Database selector option (import modal)
    step1: Відкрийте # Instruction step 1 prefix
    schemaRb: schema.rb # File name (code font)
    step1Suffix: файл вашого проєкту в будь-якому редакторі коду # Instruction step 1 suffix
    step2: Скопіюйте вміст schema.rb і вставте його в це модальне вікно # Instruction step 2

  # ========================================
  # SQL Server Import - SQL Server instructions
  # ========================================
  sqlServer:
    title: SQL Server # Database selector option (import modal)
    step1: Завантажте та встановіть # Instruction step 1 prefix
    tool: SQL Server Management Studio # Tool name
    step1Suffix: SSMS # Tool abbreviation
    step2: Відкрийте SSMS і підключіться до свого SQL-сервера # Instruction step 2
    step3: Після підключення клацніть правою кнопкою миші базу даних, яку потрібно експортувати, і виберіть # Instruction step 3 prefix
    scriptDatabaseAs: Створити сценарій бази даних як # Menu option name
    createTo: CREATE To # Menu option continuation
    newQueryEditorWindows: Нові вікна редактора запитів # Sub-menu option
    step4: Скопіюйте отриманий вивід SQL і вставте його в це модальне вікно # Instruction step 4

  # ========================================
  # Oracle Import - Oracle database instructions
  # ========================================
  oracle:
    title: Oracle # Database selector option (import modal)
    description: Виконайте наведені нижче команди вручну, потім завантажте файл SQL за допомогою # Description intro
    uploadSql: Завантажити .sql # Upload button label
    createDirectory: Створіть об'єкт каталогу в Oracle # Command 1 description
    grantPrivileges: Надайте дозволи на читання та запис об'єкта каталогу # Command 2 description
    exportSchema: Експортуйте потрібну схему у файл дампа # Command 3 description
    convertDump: Перетворіть файл дампа на файл SQL # Command 4 description

  # ========================================
  # Snowflake Import - Snowflake database instructions
  # ========================================
  snowflake:
    title: Snowflake # Database selector option (import modal)
    description: Виконайте # Description intro
    getDdl: GET_DDL # Command name
    descriptionSuffix: команду вручну, потім скопіюйте та вставте результат у текстове поле на екрані або збережіть його у файл і завантажте за допомогою # Description suffix
    uploadSql: Завантажити .sql # Upload button label
    exportAllTables: Експорт DDL усіх таблиць усієї бази даних # Feature description
    selectSchema: Вибрати всі таблиці в одній схемі # Feature description