# Pricing translations - Public pricing page, plan cards, feature comparison, FAQ
# UI Areas: Pricing landing page, Plan cards, Feature blocks, Comparison table, dbdocs promos

pricing:
  # ========================================
  # Pricing Landing Page - Top-level headings
  # ========================================
  landing:
    badge: Один тарифний план для dbdiagram і dbdocs # Badge above title
    title: Оновіть свій робочий простір # Page title
    subtitle: Кожен платний тарифний план містить dbdiagram і dbdocs разом. # Subtitle

  # ========================================
  # Unified Plan Modal (PricingPlanModal) - header copy not shared with the landing page above
  # ========================================
  modal:
    subtitle: Завжди безкоштовно. Отримайте більше можливостей із нашими платними тарифними планами. # Modal subtitle
    alwaysFree:
