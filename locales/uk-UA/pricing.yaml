      runsqlCaption: SQL-середовище в браузері # RunSQL lozenge caption
    provisioningTitle: "Налаштування робочого простору…" # Blocking state title while a workspace is being provisioned

  # ========================================
  # Misc UI labels
  # ========================================
  ui:
    learnMore: "Докладніше →" # Learn more link in feature blocks
    faqTitle: Часті запитання # FAQ section title
    taxNote: "* Ваш платіж оподатковується відповідно до законодавства вашої країни" # Tax disclaimer under FAQ
    plansAndFeatures: Тарифні плани та функції # Comparison table heading
    features: Функції # Comparison table column header
    whatsInProPlan: "Що входить до нашого тарифного плану Personal Pro?" # Pro feature section title
    whatsInTeamPlan: "Що входить до нашого тарифного плану Team?" # Team feature section title
    dbdocsFreePaidTitle: dbdocs # Free vs Paid table eyebrow label
    dbdocsFreePaidHeading: Безкоштовний vs платний # Free vs Paid table heading

  # ========================================
  # Billing Toggle - Monthly/Annual switch
  # ========================================
  billingToggle:
    monthly: Щомісячно # Left toggle label
    annual: Щорічно # Right toggle label
    saveUpTo: "Заощаджуйте до {percent}%" # Save badge text

  # ========================================
  # Plan Names
  # ========================================
  planNames:
    free: Безкоштовний # Free plan name
    personalPro: Personal Pro # Personal Pro plan name
    team: Team # Team plan name
    customPlan: Власний тариф # Enterprise/Custom plan name

  # ========================================
  # Plan Taglines
  # ========================================
  taglines:
    free: Для окремих користувачів, які проєктують схеми та діляться публічною документацією. # Free plan tagline
    pro: Для фрилансерів і консультантів, які проєктують і документують. # Pro plan tagline
    team: Для команд, які спільно проєктують і документують бази даних. # Team plan tagline
    enterprise: Для організацій із потребами у сфері безпеки та закупівель. # Enterprise plan tagline

  # ========================================
  # Plan Card - Price display
  # ========================================
  price:
    free: Безкоштовно # Free plan price text
    freeNote: "і це назавжди" # Free plan price note
    customPricing: Власна ціна # Enterprise price text
    contactForPricing: Дізнатися ціну # Enterprise price note
    perMonth: /міс. # Per month unit suffix
    billedAnnually: "Оплата щороку — {currency}{amount} на рік" # Annual billing hint
    billedMonthly: Оплата щомісяця # Monthly billing hint

  # ========================================
  # Plan Card - CTA Buttons
  # ========================================
  cta:
