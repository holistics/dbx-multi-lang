        description: Документні проєкти з повним набором функцій. Безкоштовні проєкти доступні на кожному тарифі
        tooltip: "Будь-яким документним проєктом можна поділитися публічно або захистити спільним паролем. Платний проєкт додає приватний режим, доступ лише для запрошених, необмежену кількість вбудованих подань і повний журнал змін схеми."
