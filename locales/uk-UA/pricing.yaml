    upgradeNow: Оновити зараз # Pro/Team upgrade CTA
    startFreeTrial: Почати 7-денний безкоштовний пробний період # Team trial CTA
    contactSales: Зв'язатися з відділом продажів # Enterprise CTA
    downgrade: Знизити тарифний план # Downgrade button
    currentPlan: Поточний тарифний план # Current plan label

