      privateDiagram:
        name: Приватний режим
        description: Залишайте діаграму або документний проєкт доступними лише вам і запрошеним людям
      inviteEditors:
        name: Запрошення редакторів і переглядачів
        description: Запрошуйте колег до спільної роботи над діаграмами та документацією
      collaborativeWorkspace:
        name: Спільний робочий простір
