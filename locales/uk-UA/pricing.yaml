    suffix: ", а також" # suffix after plan name
    free: Безкоштовний # Inherits from Free
    personalPro: Personal Pro # Inherits from Personal Pro
    team: Team # Inherits from Team

  # ========================================
  # Plan Card - Tier limits
  # ========================================
  tiers:
    upTo10Diagrams: До 10 діаграм і документних проєктів # Free tier capacity
    unlimitedDiagrams: Необмежена кількість діаграм і документних проєктів # Paid tier capacity
    users: "Один користувач | {count} користувачів" # Plan card user-count tier, pluralized by quantity (1/3/10/...)
    docProjects: "{count} платний документний проєкт dbdocs | {count} платних документних проєктів dbdocs" # Plan card doc-project tier, pluralized by quantity

  # ========================================
  # Plan Card - Add-ons
  # ========================================
  addons:
    label: "Розширення:" # Add-ons section label
    extraDocProject: Додатковий платний документний проєкт # Doc project addon name
    extraUser: Додатковий користувач # User addon name
    extraUserTooltip: "Ліцензія користувача призначена для редакторів - людей, які створюють і змінюють діаграми та документацію. Глядачі завжди безкоштовні й ніколи не потребують ліцензії." # User addon tooltip

  # ========================================
  # Plan Card - Features lists
  # ========================================
  cardFeatures:
    free:
      sqlImportExport: Імпорт і експорт SQL
      exportFormats: Експорт у PDF/PNG/SVG
      publicSharing: Публічний доступ
      embedDiagrams: Вбудовування діаграм і документації на ваш сайт
      dataSample: Зразок даних
      cliIntegration: Інтеграція з конвеєром CI/CD через dbdiagram CLI
    pro:
      unlimitedViews: Необмежена кількість подань діаграм
      passwordProtected: Спільний доступ із захистом паролем і приватний доступ
      limitedCollaboration: Обмежена спільна робота
      advancedVisualization: Розширена візуалізація для роботи з великими базами даних
    team:
      collaborativeWorkspace: Спільний робочий простір
      teamManagement: Керування командою та спільна робота
      unifiedBilling: Єдине адміністрування та виставлення рахунків
    enterprise:
      prioritizedFeature: Пріоритетний запит на функцію
      procurementReview: Перевірка закупівель або юридична перевірка
      customPayment: Індивідуальні умови оплати
      samlSso: SAML SSO
      activityLog: Журнал активності користувачів (незабаром)
      ipAllowList: Список дозволених IP-адрес (незабаром)

  # ========================================
  # Feature Blocks - Pro features
  # ========================================
  featureBlocks:
    pro:
      diagramViews:
        title: Почніть із малого з поданнями діаграми
        description: "Думайте масштабно, починайте з малого. Створюйте кілька сфокусованих подань однієї діаграми. Показуйте таблиці, потрібні для предметної області, робочого процесу або командного обговорення."
      passwordProtection:
        title: Захистіть діаграму за допомогою захисту паролем
        description: Захищайте свої діаграми паролем і підвищуйте конфіденційність. Ідеально для внутрішнього доступу в команді.
      tableGroups:
        title: Краще впорядковуйте за допомогою груп таблиць
        description: Об'єднуйте кілька таблиць для зручнішої візуалізації. Зменшуйте обсяг роботи з базами даних, що містять багато таблиць.
      headerColors:
        title: Керуйте діаграмами за допомогою кольору заголовків
        description: Легко керуйте діаграмами та документами баз даних, змінюючи кольори заголовків таблиць і роблячи їх яскравішими!
      detailLevels:
        title: Спрощуйте діаграми за допомогою рівнів деталізації
        description: Перемикайтеся між різними рівнями деталізації, щоб спростити діаграми. Ця функція особливо корисна під час роботи з великими проєктами баз даних.
      stickyNotes:
        title: Працюйте разом ефективніше за допомогою стікерів
        description: "Потрібно швидко занотувати нагадування або розгорнути складну ідею? Додавайте нотатки безпосередньо до діаграм саме там, де вони потрібні."
      aiAssistant:
        title: Прискорюйте робочий процес за допомогою AI Assistant
        description: Отримуйте інтелектуальні пропозиції та пришвидшуйте процес проєктування баз даних за допомогою нашого помічника на основі ШІ.
      collaboration:
        title: Спільне редагування в реальному часі
        description: Запрошуйте колег працювати разом із вами над однією діаграмою в реальному часі.
      versionHistory:
        title: Повертайтеся в минуле за допомогою історії версій
        description: Вільно експериментуйте з ідеями, використовуючи різні версії схеми. Повертайтеся до попередньої версії в будь-який момент.
      schemaChangelog:
        title: Необмежена історія журналу змін схеми
        description: "Більше ніколи не втрачайте інформацію про зміни схеми бази даних. Отримуйте доступ до всіх змін схеми, переглядайте версії, старші за 14 днів, і легко порівнюйте будь-які дві версії."
      embeddedViews:
        title: Вбудовані подання
        description: "Ви можете вбудувати документацію бази даних у такі платформи, як Notion, Confluence, Miro або навіть на власний сайт. Переглядайте документацію бази даних у звичному для вас інструменті."
      shareWithInvitedUsers:
        title: Діліться із запрошеними користувачами
        description: "Безпосередньо запрошуйте колег до свого проєкту та керуйте ними - ідеально для внутрішньої командної роботи."
    team:
      collaborativeWorkspace:
        title: Спільний робочий простір
        description: "Майте єдине місце, де вся команда може зберігати, переглядати та поширювати діаграми й документи баз даних."
      teamManagement:
        title: Керування командою та спільна робота
        description: "Запрошуйте колег і керуйте ними в одному робочому просторі, щоб вони могли користуватися перевагами тарифу Team."
      unifiedBilling:
        title: Єдине адміністрування та виставлення рахунків
        description: Купуйте та керуйте кількома ліцензіями користувачів для членів команди. Керуйте користувачами й оплатою в одному місці.

