  # ========================================
  # FAQ Section
  # ========================================
  faq:
    - question: Як працює ціноутворення?
      answerHtml: "&bull; Безкоштовний тарифний план доступний назавжди. Тарифний план Personal Pro відкриває Pro-функції в dbdiagram і dbdocs у вашому особистому робочому просторі.<br><br>&bull; Тарифний план Team об'єднує вашу команду для спільної роботи в централізованому командному робочому просторі в dbdiagram і dbdocs."
    - question: Як керувати підпискою?
      answerHtml: "Керувати підпискою робочого простору можна в розділі Home > Billing. Ярлик \"Home\" робочого простору розташований у меню облікового запису у верхньому правому куті."
    - question: Чи зберігаєте ви дані моєї кредитної картки?
      answerHtml: "Ні, ми не обробляємо дані вашої кредитної картки безпосередньо. Для обробки платежу ми використовуємо Stripe."
    - question: Що станеться, якщо я скасую підписку?
      answerHtml: Після скасування підписки ваш робочий простір повернеться до безкоштовного тарифного плану. Приватні проєкти буде перетворено на публічні, а учасники робочого простору не зможуть отримати до нього доступ.
    - question: Чи буде мій тарифний план поновлено автоматично?
      answerHtml: Платна підписка поновлюється автоматично, якщо ви не скасуєте тарифний план до завершення періоду підписки.
    - question: Чи отримую я функції dbdiagram і dbdocs в одному тарифному плані?
      answerHtml: "Так, ви отримаєте функції dbdiagram і dbdocs в одному тарифному плані."
    - question: Як працює власний тарифний план?
      answerHtml: "Власні тарифні плани налаштовуються для організацій із конкретними потребами. Зверніться до нашої команди продажів, щоб обговорити ціни, індивідуальні умови оплати та корпоративні функції, як-от SSO і пріоритетна підтримка."
    - question: "Я турбуюся про безпеку. Чи пропонуєте ви версію dbdocs для самостійного розгортання?"
