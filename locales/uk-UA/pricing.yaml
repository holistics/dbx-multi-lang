        description: Відстежуйте, як опублікована схема змінювалася з часом, і порівнюйте будь-які дві версії
      tableGroup:
        name: Група таблиць
        description: Візуально впорядковуйте пов'язані таблиці за допомогою груп
      headerColor:
        name: Колір заголовка
        description: Налаштовуйте кольори заголовків таблиць для кращого впорядкування
      detailLevels:
        name: Рівні деталізації
        description: Керуйте видимістю деталей таблиць у різних поданнях
      stickyNotes:
